apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge-api
  namespace: coding-judge
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: judge-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: judge-api
        app.kubernetes.io/part-of: coding-judge
    spec:
      serviceAccountName: judge-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/hamzavaid/online-coding-judge-api:0.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_ADDR
              valueFrom:
                configMapKeyRef:
                  name: judge-runtime
                  key: API_ADDR
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: judge-runtime
                  key: REDIS_ADDR
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: judge-runtime-secrets
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 5
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: judge-api
  namespace: coding-judge
spec:
  selector:
    app.kubernetes.io/name: judge-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: judge-api
  namespace: coding-judge
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: judge-api
